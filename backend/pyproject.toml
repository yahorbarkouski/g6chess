[project]
name = "g6explanation"
version = "0.1.0"
description = "Evidence-grounded context engine for single-move chess explanations."
requires-python = ">=3.11"
dependencies = [
  "chess>=1.10,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
maia = [
  "maia2==0.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/g6explanation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
